
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Bangladesh Motocross Club & Academy</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }
    header {
      background: #16803D;
      padding: 24px 12px;
    }
    h1 { margin: 0 0 10px; }
    .back {
      display: inline-block;
      margin: 18px;
      padding: 12px 22px;
      background: #16803D;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .gallery img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #16803D;
    }
    footer {
      padding: 20px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏁 Racing Gallery</h1>
    <p>Bangladesh Motocross Club & Academy</p>
  </header>

  <a class="back" href="index.html">⬅ Back to Home</a>

  <div class="gallery">
    <img src="images/race-start.jpg" alt="Motocross Racing">
    <img src="images/sultan-sheikh.jpg" alt="Sultan Sheikh #77">
    <img src="images/Bul%20bul.jpg" alt="Baundal Bulbul #07">
  </div>

  <footer>
    Bangladesh Motocross Club & Academy
  </footer>
</body>
</html>
